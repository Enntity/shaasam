name: Shaasam security monitoring health
on:
  schedule:
    - cron: '38 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shaasam-security-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - name: Verify public health and authentication boundary
        run: |
          set -eu
          test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' https://shaasam.com/api/health)" = 200
          test "$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' https://shaasam.com/api/humans/requests)" = 401
      - name: Verify host monitoring freshness and signals
        if: always()
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # The pinned SSH action negotiates the verified ECDSA host key.
          fingerprint: SHA256:Zmhlr4qrnHc3J3JhDGPpv4VK9f6oe4bQEndjXNrQThI
          command_timeout: 1m
          script_stop: true
          script: sudo -n python3 /opt/enntity-defense/monitor_health.py
