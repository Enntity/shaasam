name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: shaasam-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Validate source
    runs-on: ubuntu-latest
    container: node:24.18.0-bookworm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
        env:
          AUTH_SECRET: build-only-placeholder-not-a-runtime-secret

  build:
    name: Build Docker Image
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Normalize image name
        id: repo
        run: echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo_lower }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "/opt/shaasam"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_LOWER: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            cd /opt/shaasam

            # Repository name must be lowercase for Docker
            REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the new image
            docker pull ghcr.io/${REPO_NAME}@${{ needs.build.outputs.image_digest }}

            # Keep the last verified release until health succeeds.
            umask 077
            printf 'IMAGE_DIGEST=%s\nGITHUB_REPOSITORY=%s\n' '${{ needs.build.outputs.image_digest }}' "$REPO_NAME" > .release.candidate.env
            docker compose --env-file .env --env-file .release.candidate.env -f docker-compose.prod.yml up -d --remove-orphans

            # Retain older images for rollback.

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            cd /opt/shaasam
            for attempt in $(seq 1 20); do
              if docker exec shaasam-app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
                if [ -f .release.env ]; then cp .release.env .release.previous.env; fi
                mv .release.candidate.env .release.env
                echo "Application and database are ready; immutable release persisted"
                exit 0
              fi
              sleep 3
            done
            echo "Readiness failed; inspect configuration and restore the previous image digest"
            exit 1
